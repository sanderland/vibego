[project]
name = "nanogo"
version = "0.1.0"
description = "A minimal KataGo-style Go engine and training pipeline, in the spirit of nanoGPT/nanochat."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.2",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nanogo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
