[project]
name = "vibego"
version = "0.1.0"
description = "A flexible, hackable platform for small-network Go experimentation (KataGo-style architectures, training, and search)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.2",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vibego"]

[tool.pytest.ini_options]
testpaths = ["tests"]
